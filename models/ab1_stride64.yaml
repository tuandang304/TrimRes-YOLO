# AB1: TrimRes-YOLO graph with the deep stage (old L7-L10) run at stride 64 through an inserted 2x average pool (L7)
# and a x4 upsample back to stride 16. COCO tensors: L0-6 -> L0-6, L7-19 -> L8-20. One-to-many head only.
nc: 10
end2end: false
reg_max: 1
scale: n
scales:
  n: [0.5, 0.25, 1024]
backbone:
- - -1
  - 1
  - Conv
  - [64, 3, 2]
- - -1
  - 1
  - Conv
  - [128, 3, 2]
- - -1
  - 2
  - C3k2
  - [256, false, 0.25]
- - -1
  - 1
  - Conv
  - [256, 3, 2]
- - -1
  - 2
  - C3k2
  - [512, false, 0.25]
- - -1
  - 1
  - Conv
  - [512, 3, 2]
- - -1
  - 2
  - C3k2
  - [512, true]
- - -1
  - 1
  - nn.AvgPool2d
  - [2, 2]
- - -1
  - 1
  - Conv
  - [1024, 3, 2]
- - -1
  - 2
  - C3k2
  - [1024, true]
- - -1
  - 1
  - SPPF
  - [1024, 5, 3, true]
- - -1
  - 2
  - C2PSA
  - [1024]
head:
- - -1
  - 1
  - nn.Upsample
  - [null, 4, nearest]
- - [-1, 6]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [512, true]
- - -1
  - 1
  - nn.Upsample
  - [null, 2, nearest]
- - [-1, 4]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [256, true]
- - -1
  - 1
  - Conv
  - [256, 3, 2]
- - [-1, 14]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [512, true]
- - [17, 20]
  - 1
  - Detect
  - [nc]
