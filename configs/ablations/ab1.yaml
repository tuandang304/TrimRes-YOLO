# AB1: deep stage kept at stride 64 (2x average pool before L7, x4 upsample back)
# Shared recipe: 100 epochs at 1280x1280, batch 16, MuSGD lr0 0.01, momentum 0.9, warmup bias LR 0,
# COCO-pretrained YOLO26n initialization, one NVIDIA L4 per seed. Run one seed per process:
#   python -m bench.main --config configs/ablations/ab1.yaml --seed 0
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: ab1
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  - 1
  - 2
  arch:
    yaml: models/ab1_stride64.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    access:
    - op: lowrank_conv
      layers:
      - 8
      rank: 64
    - op: lowrank_pw
      layers:
      - 10
      attr: cv2
      rank: 128
    - op: hybrid_c3k
      layers:
      - 9
      idx: 0
      replace: true
      ratio: 2
      d: 32
    - op: hybrid_c3k
      layers:
      - 9
      idx: 1
      replace: true
      ratio: 2
      d: 32
    - op: linattn_psa
      layers:
      - 11
    - op: repconv
      layers:
      - 14
  extra:
    workers: 8
    cache: false
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
