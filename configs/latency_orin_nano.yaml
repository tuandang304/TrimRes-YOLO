# Latency on a Jetson Orin Nano 8 GB (Super, MAXN_SUPER, jetson_clocks): eager PyTorch FP16 rounds, then TensorRT FP16
# rounds (one engine per checkpoint, built on the device), plus peak memory. Set up with scripts/setup_jetson.sh, then
#   python -m bench.main --config configs/latency_orin_nano.yaml   (checkpoints in weights/<tag>.pt)
data_root: ~/visdrone/data
data_splits: [valid]
tasks: [measure]
measure:
  split: valid
  ap: false
  rounds: 5
  order_seed: 0
  latency_images: 200
  n_warm: 30
  n_iter: 200
  deploy: {prebuild_engines: true, peak_mem: true, trt: true, onnx_cpu: false, rounds: 5, order_seed: 1, n_warm: 30, n_iter: 200}
  models:
  - {tag: trimres_s0, family: ultralytics, ckpt: weights/trimres_s0.pt, imgsz: 1280, latency: true}
  - {tag: trimres_s1, family: ultralytics, ckpt: weights/trimres_s1.pt, imgsz: 1280, latency: true}
  - {tag: trimres_s2, family: ultralytics, ckpt: weights/trimres_s2.pt, imgsz: 1280, latency: true}
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true}
  - {tag: public_yolov10n, family: ultralytics, ckpt: weights/public_yolov10n.pt, imgsz: 1280, latency: true}
  - {tag: ab3_s0, family: ultralytics, ckpt: weights/ab3_s0.pt, imgsz: 1280, latency: true}
